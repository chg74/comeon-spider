<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AL ANKABOOT SPORT | البث المباشر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#f2c14e;--bg:#06080e;--line:rgba(255,255,255,.07);--txt:#e9eef8;--muted:#8695ac}
html,body{height:100%;overflow:hidden}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--txt);user-select:none;-webkit-user-select:none;
  background:radial-gradient(1200px 600px at 90% -15%,#1b2436,transparent 60%),
             radial-gradient(900px 500px at -10% 110%,#241b06,transparent 55%),var(--bg)}
button,input{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
img{-webkit-user-drag:none;pointer-events:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
#app{height:100vh;display:flex;flex-direction:column}
.topbar{height:66px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid var(--line);background:rgba(8,12,20,.85);backdrop-filter:blur(14px);z-index:30}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(145deg,#f2c14e,#a8791a);box-shadow:0 6px 18px rgba(242,193,78,.28)}
.brand-txt h1{font-size:17px;font-weight:900;letter-spacing:1px;line-height:1.1;
  background:linear-gradient(90deg,#fff,#f2c14e);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-txt span{font-size:9.5px;color:var(--muted);letter-spacing:2.4px;font-weight:600}
.spacer{flex:1}
.tg-mini{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;
  font-size:12.5px;font-weight:800;background:linear-gradient(145deg,#29b6f6,#0288d1);
  color:#fff;text-decoration:none;white-space:nowrap}
.tg-mini svg{width:17px;height:17px;fill:#fff}
.screen{flex:1;overflow-y:auto;padding:22px 18px 40px;display:none;animation:fadeUp .35s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:26px 16px 32px;background:linear-gradient(180deg,rgba(242,193,78,.08),transparent);
  border-radius:22px;border:1px solid rgba(242,193,78,.15);margin-bottom:26px}
.hero h2{font-size:22px;font-weight:900;margin-bottom:8px;
  background:linear-gradient(90deg,#fff,#f2c14e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:13px;color:var(--muted);line-height:1.7}
.section-title{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.section-title::before{content:"";width:5px;height:24px;border-radius:5px;background:linear-gradient(180deg,#f2c14e,#a8791a)}
.section-title h3{font-size:17px;font-weight:900}
.section-title .count{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;
  background:rgba(242,193,78,.15);color:var(--gold)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cat-card{padding:20px 18px;border-radius:18px;text-align:right;
  background:linear-gradient(145deg,rgba(20,29,46,.95),rgba(14,21,33,.95));border:1px solid var(--line);
  transition:.25s;display:flex;flex-direction:column;align-items:flex-start}
.cat-card:hover{transform:translateY(-4px);border-color:rgba(242,193,78,.5)}
.cat-icon{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:24px;margin-bottom:14px;
  overflow:hidden;background:linear-gradient(145deg,#f2c14e,#a8791a);color:#1a1206;font-weight:900;flex-shrink:0}
.cat-icon img{width:100%;height:100%;object-fit:contain;padding:4px}
.cat-card .name{font-size:16px;font-weight:800;margin-bottom:6px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;width:100%}
.cat-card .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.back-bar{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:12px 16px;border-radius:14px;
  background:rgba(255,255,255,.03);border:1px solid var(--line)}
.back-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:rgba(242,193,78,.15);color:var(--gold)}
.back-bar h3{flex:1;font-size:16px;font-weight:900}
.back-bar .counter{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;
  background:rgba(242,193,78,.15);color:var(--gold)}
.chan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chan-card{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:14px;text-align:right;
  transition:.22s;background:linear-gradient(145deg,rgba(20,29,46,.9),rgba(14,21,33,.9));
  border:1px solid var(--line)}
.chan-card:hover{transform:translateX(-3px);border-color:rgba(242,193,78,.4)}
.chan-logo{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(145deg,#1d2739,#131a28);border:1px solid var(--line);font-size:13px;font-weight:900;color:var(--gold)}
.chan-logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.chan-info{flex:1;min-width:0}
.chan-info b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan-info small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.chan-play{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(145deg,#f2c14e,#c9922c);color:#1a1206}
.empty-box{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-box .ico{font-size:64px;opacity:.35;margin-bottom:16px}
.empty-box h4{font-size:17px;color:#c8d3e4;margin-bottom:8px;font-weight:800}
.empty-box p{font-size:13px;line-height:1.8}
.watch{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
.watch.open{display:flex}
.watch-top{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,.95),rgba(0,0,0,.7));border-bottom:1px solid rgba(255,255,255,.06);z-index:5}
.watch-close{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:rgba(255,77,94,.15);color:#ff8a95;flex-shrink:0}
.watch-info{flex:1;min-width:0}
.watch-info h3{font-size:15px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.watch-info small{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;display:block}
.watch-fs{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:rgba(255,255,255,.08);color:#fff;flex-shrink:0}
.watch-stage{flex:1;position:relative;background:#000;min-height:0}
#player{position:absolute;inset:0;background:#000}
#player video,#player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.watch-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:#000;z-index:3;pointer-events:none}
.watch-loading.hidden{display:none}
.spinner{width:52px;height:52px;border-radius:50%;border:3px solid rgba(242,193,78,.15);border-top-color:#f2c14e;
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.watch-loading p{font-size:13px;color:var(--muted);font-weight:700}
.watch-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:#000;z-index:4;text-align:center;padding:20px}
.watch-error .ico{font-size:52px;opacity:.5}
.watch-error h4{font-size:16px;font-weight:800;color:#c8d3e4}
.watch-error p{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;
  background:linear-gradient(145deg,#1a2436,#111a28);border:1px solid rgba(242,193,78,.4);
  box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:500;transition:.35s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.loading-app{position:fixed;inset:0;background:#06080e;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:900}
.loading-app.hidden{display:none}
.loading-app .spinner{width:60px;height:60px}
.loading-app p{color:#8695ac;font-size:13px;font-weight:700}
@media(max-width:700px){
  .brand-txt span{display:none}
  .brand-txt h1{font-size:15px}
  .tg-mini span{display:none}
  .tg-mini{padding:8px 11px}
  .screen{padding:16px 12px 30px}
  .hero h2{font-size:19px}
  .cat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .cat-card{padding:16px 14px}
  .cat-icon{width:48px;height:48px;font-size:20px;margin-bottom:10px}
  .cat-card .name{font-size:14px}
  .chan-grid{grid-template-columns:1fr}
  .watch-info small{display:none}
}
@media(max-width:380px){.cat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="loading-app" id="appLoading">
  <div class="spinner"></div>
  <p>جاري تحميل القنوات...</p>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🕷️</div>
      <div class="brand-txt">
        <h1>AL ANKABOOT</h1>
        <span>SPORTS • LIVE STREAMING</span>
      </div>
    </div>
    <div class="spacer"></div>
    <a class="tg-mini" id="tgMini" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
      <span>انضمام للقناة</span>
    </a>
  </header>

  <section class="screen active" id="screenHome">
    <div class="hero">
      <h2>📺 اختر القسم اللي تحبه</h2>
      <p>كل قسم جواه مجموعة قنوات — اختار القسم وشوف القنوات المتاحة</p>
    </div>
    <div class="section-title">
      <h3>الأقسام المتاحة</h3>
      <span class="count" id="homeCount">0</span>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <section class="screen" id="screenChans">
    <div class="back-bar">
      <button class="back-btn" id="backHomeBtn">→</button>
      <h3 id="catTitle">—</h3>
      <span class="counter" id="catCounter">0 قناة</span>
    </div>
    <div class="chan-grid" id="chanGrid"></div>
  </section>
</div>

<div class="watch" id="watch">
  <div class="watch-top">
    <button class="watch-close" id="closeWatch">✕</button>
    <div class="watch-info">
      <h3 id="watchName">—</h3>
      <small id="watchCat">—</small>
    </div>
    <button class="watch-fs" id="fsBtn">⛶</button>
  </div>
  <div class="watch-stage">
    <div id="player"></div>
    <div class="watch-loading" id="watchLoading">
      <div class="spinner"></div>
      <p>جاري تشغيل البث...</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var PANTRY_ID = '5dd567ce-5bb7-46a4-8005-d022dd892f32';
  var BASKET    = 'ankaboot_data';
  var CACHE_KEY = 'ankaboot_cached_data';

  var state = { telegram:'https://t.me/alankabootsport', categories:[] };
  var currentCatId = null;
  var hlsInstance = null;
  var lastCloudJson = '';

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function initials(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase(); }

  var tt;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  /* ===== Cloud ===== */
  async function loadFromCloud(){
    try{
      var res = await fetch('https://getpantry.cloud/apiv1/pantry/' + PANTRY_ID + '/basket/' + BASKET + '?t=' + Date.now());
      if(!res.ok) throw new Error('bad');
      return await res.json();
    }catch(e){ return null; }
  }
  function loadFromCache(){ try{ var raw = localStorage.getItem(CACHE_KEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; } }
  function saveToCache(data){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){} }

  function renderTelegram(){ var url = state.telegram || 'https://t.me/alankabootsport'; $('tgMini').href = url; }

  function renderHome(){
    var grid = $('catGrid');
    var cats = state.categories;
    $('homeCount').textContent = cats.length;
    if(!cats.length){
      grid.innerHTML = '<div class="empty-box" style="grid-column:1/-1"><div class="ico">📭</div><h4>لا توجد أقسام بعد</h4><p>افتح لوحة التحكم وأضف قسماً ثم أضف القنوات جواه.</p></div>';
      return;
    }
    grid.innerHTML = cats.map(function(cat){
      var icon = cat.logo ? '<img src="' + esc(cat.logo) + '" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + esc(initials(cat.name)) + '\'">' : esc(initials(cat.name));
      return '<button class="cat-card" data-cat="' + cat.id + '"><div class="cat-icon">' + icon + '</div><div class="name">' + esc(cat.name) + '</div><div class="meta"><span>📺</span><span>' + (cat.channels||[]).length + ' قناة</span></div></button>';
    }).join('');
  }

  function renderChannels(catId){
    var cat = state.categories.find(function(c){ return c.id === catId; });
    if(!cat) return;
    currentCatId = catId;
    $('catTitle').textContent = cat.name;
    $('catCounter').textContent = (cat.channels||[]).length + ' قناة';
    var grid = $('chanGrid');
    var chans = cat.channels || [];
    if(!chans.length){ grid.innerHTML = '<div class="empty-box" style="grid-column:1/-1"><div class="ico">📺</div><h4>لا توجد قنوات في هذا القسم</h4></div>'; return; }
    grid.innerHTML = chans.map(function(ch){
      var logo = ch.logo ? '<img src="' + esc(ch.logo) + '" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + esc(initials(ch.name)) + '\'">' : esc(initials(ch.name));
      return '<button class="chan-card" data-chan="' + ch.id + '"><span class="chan-logo">' + logo + '</span><span class="chan-info"><b>' + esc(ch.name) + '</b><small>اضغط للمشاهدة</small></span><span class="chan-play">▶</span></button>';
    }).join('');
  }

  function showScreen(id){ var ss = document.querySelectorAll('.screen'); for(var i=0;i<ss.length;i++) ss[i].classList.remove('active'); $(id).classList.add('active'); }

  /* ============================================================
     PLAYER — يستخدم البروكسي /api/proxy
     ============================================================ */
  function destroyPlayer(){
    if(hlsInstance){ try{ hlsInstance.destroy(); }catch(e){} hlsInstance = null; }
    var p = $('player');
    var v = p.querySelector('video');
    if(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} }
    p.innerHTML = '';
  }

  function showWatchError(msg, url){
    var stage = document.querySelector('.watch-stage');
    var old = stage.querySelector('.watch-error');
    if(old) old.remove();
    var err = document.createElement('div');
    err.className = 'watch-error';
    var safeUrl = esc(url).replace(/'/g, "\\'");
    err.innerHTML = '<div class="ico">⚠️</div><h4>تعذر تشغيل البث</h4><p>' + esc(msg) + '</p>'
      + '<p style="margin-top:14px;font-size:11px;color:#8695ac;word-break:break-all;direction:ltr;text-align:center;max-width:90%">' + esc(url) + '</p>'
      + '<button type="button" onclick="window.__openExternal(\'' + safeUrl + '\')" '
      + 'style="margin-top:16px;padding:12px 24px;border-radius:11px;background:linear-gradient(145deg,#f2c14e,#c9922c);color:#1a1206;font-weight:800;font-size:13px;border:0;cursor:pointer;font-family:Cairo,sans-serif">'
      + '↗ فتح في مشغل خارجي</button>';
    stage.appendChild(err);
    $('watchLoading').classList.add('hidden');
  }

  window.__openExternal = function(url){
    if(/Android/i.test(navigator.userAgent)){
      var scheme = url.indexOf('https') === 0 ? 'https' : 'http';
      var intentUrl = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=' + scheme + ';type=application/x-mpegURL;end';
      try{ window.location.href = intentUrl; return; }catch(e){}
    }
    window.open(url, '_blank');
  };

  function openWatch(catId, chanId){
    var cat = state.categories.find(function(c){ return c.id === catId; });
    if(!cat) return;
    var chan = (cat.channels||[]).find(function(c){ return c.id === chanId; });
    if(!chan) return;

    $('watchName').textContent = chan.name;
    $('watchCat').textContent = cat.name;
    $('watch').classList.add('open');
    document.body.style.overflow = 'hidden';

    destroyPlayer();
    var stage = document.querySelector('.watch-stage');
    var oldErr = stage.querySelector('.watch-error');
    if(oldErr) oldErr.remove();
    $('watchLoading').classList.remove('hidden');

    var url = (chan.url || '').trim();
    var player = $('player');

    if(!url){ showWatchError('لا يوجد رابط بث', ''); return; }

    // روابط iframe
    if(/\.(html?|php|aspx?)(\?|#|$)/i.test(url) && !/m3u8/i.test(url)){
      var frame = document.createElement('iframe');
      frame.src = url; frame.allowFullscreen = true;
      frame.setAttribute('allow','autoplay; fullscreen; encrypted-media');
      frame.setAttribute('referrerpolicy','no-referrer');
      player.appendChild(frame);
      setTimeout(function(){ $('watchLoading').classList.add('hidden'); }, 2500);
      return;
    }

    // كل الروابط التانية → بروكسي + hls.js
    var video = document.createElement('video');
    video.controls = true; video.autoplay = true; video.playsInline = true;
    video.setAttribute('controlsList','nodownload');
    video.setAttribute('oncontextmenu','return false');
    player.appendChild(video);

    // ⭐ استخدام البروكسي
    var proxiedUrl = '/api/proxy?url=' + encodeURIComponent(url);

    if(window.Hls && window.Hls.isSupported()){
      hlsInstance = new Hls({
        lowLatencyMode: true,
        enableWorker: true,
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        manifestLoadingTimeOut: 20000,
        manifestLoadingMaxRetry: 3,
        levelLoadingTimeOut: 20000,
        levelLoadingMaxRetry: 3,
        fragLoadingTimeOut: 30000,
        fragLoadingMaxRetry: 6,
        startLevel: -1
      });

      hlsInstance.loadSource(proxiedUrl);
      hlsInstance.attachMedia(video);

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(){
        $('watchLoading').classList.add('hidden');
        video.play().catch(function(){});
      });

      hlsInstance.on(Hls.Events.ERROR, function(e, data){
        if(!data.fatal) return;
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
        else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
        else showWatchError('الرابط لا يعمل', url);
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = proxiedUrl;
      video.addEventListener('loadedmetadata', function(){ $('watchLoading').classList.add('hidden'); });
      video.addEventListener('error', function(){ showWatchError('الرابط لا يعمل', url); });
      video.play().catch(function(){});
    } else {
      showWatchError('المتصفح لا يدعم هذا النوع من البث', url);
    }
  }

  function closeWatch(){
    $('watch').classList.remove('open');
    document.body.style.overflow = '';
    destroyPlayer();
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  }

  /* ===== Events ===== */
  $('catGrid').addEventListener('click', function(e){ var card = e.target.closest('.cat-card'); if(!card) return; renderChannels(card.dataset.cat); showScreen('screenChans'); });
  $('backHomeBtn').addEventListener('click', function(){ showScreen('screenHome'); });
  $('chanGrid').addEventListener('click', function(e){ var card = e.target.closest('.chan-card'); if(!card || !currentCatId) return; openWatch(currentCatId, card.dataset.chan); });
  $('closeWatch').addEventListener('click', closeWatch);
  $('fsBtn').addEventListener('click', function(){ var el = $('watch'); if(!document.fullscreenElement){ if(el.requestFullscreen) el.requestFullscreen(); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } else { if(document.exitFullscreen) document.exitFullscreen(); } });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && $('watch').classList.contains('open')) closeWatch(); });

  /* ===== Sync ===== */
  async function syncFromCloud(silent){
    var cloud = await loadFromCloud();
    if(!cloud || !cloud.categories) return;
    var json = JSON.stringify(cloud);
    if(json === lastCloudJson) return;
    lastCloudJson = json;
    state = { telegram: cloud.telegram || 'https://t.me/alankabootsport', categories: cloud.categories };
    saveToCache(state);
    renderTelegram();
    renderHome();
    if(currentCatId && $('screenChans').classList.contains('active')){
      var still = state.categories.find(function(c){ return c.id === currentCatId; });
      if(still) renderChannels(currentCatId);
      else { showScreen('screenHome'); currentCatId = null; }
    }
    if(!silent) toast('تم تحديث القنوات 🔄');
  }

  setInterval(function(){ syncFromCloud(false); }, 1500);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncFromCloud(true); });
  window.addEventListener('focus', function(){ syncFromCloud(true); });

  /* ===== Init ===== */
  async function init(){
    var cached = loadFromCache();
    if(cached && cached.categories){ state = cached; lastCloudJson = JSON.stringify(cached); renderTelegram(); renderHome(); }
    var cloud = await loadFromCloud();
    if(cloud && cloud.categories){ state = { telegram: cloud.telegram || 'https://t.me/alankabootsport', categories: cloud.categories }; lastCloudJson = JSON.stringify(cloud); saveToCache(state); }
    renderTelegram(); renderHome(); $('appLoading').classList.add('hidden');
  }

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'F12'){ e.preventDefault(); return false; }
    if(e.ctrlKey && e.shiftKey && 'IJCK'.indexOf(e.key) >= 0){ e.preventDefault(); return false; }
    if(e.ctrlKey && 'uUsSpPaA'.indexOf(e.key) >= 0){ e.preventDefault(); return false; }
  }, true);
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });

  init();

})();
</script>
</body>
</html>
